name: Deploy Browser Runtime

on:
  push:
    branches: [main]
    paths:
      - "kondooit-runtime/**"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.122

      - name: Build WASM
        working-directory: kondooit-runtime
        run: |
          cargo build --target wasm32-unknown-unknown --release
          wasm-bindgen \
            --target web \
            --out-dir wasm-out \
            target/wasm32-unknown-unknown/release/kondooit_runtime.wasm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build React app
        working-directory: web
        run: |
          npm ci
          npx vite build --mode runtime

      - name: Assemble site
        run: |
          mkdir -p _site/runtime

          # React app is the base — its index.html, JS, CSS, and assets
          cp -r web/dist/* _site/runtime/

          # WASM files go into /runtime/wasm/ where tunnel.ts loads them
          mkdir -p _site/runtime/wasm
          cp kondooit-runtime/wasm-out/* _site/runtime/wasm/

          # SPA fallback: GitHub Pages serves 404.html for unknown paths.
          # It must be at the repo root so it covers /runtime/* sub-paths.
          cp _site/runtime/index.html _site/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
