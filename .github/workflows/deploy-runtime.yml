name: Deploy Browser Runtime

on:
  push:
    branches: [main]
    paths:
      - "kondooit-runtime/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.122

      - name: Build WASM
        working-directory: kondooit-runtime
        run: |
          cargo build --target wasm32-unknown-unknown --release
          wasm-bindgen \
            --target web \
            --out-dir public/wasm \
            target/wasm32-unknown-unknown/release/kondooit_runtime.wasm

      - name: Prepare pages artifact
        run: |
          mkdir -p _site/runtime
          cp -r kondooit-runtime/public/* _site/runtime/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
